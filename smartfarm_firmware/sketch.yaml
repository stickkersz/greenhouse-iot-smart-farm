# Build profile — ล็อก fqbn + partition + เวอร์ชัน core/library ให้ build ซ้ำได้เหมือนเดิมทุกเครื่อง
#
# รัน:  arduino-cli compile                 (อยู่ในโฟลเดอร์นี้ — ใช้ default_profile อัตโนมัติ)
#       arduino-cli compile smartfarm_firmware   (จาก root ของโปรเจกต์)
#       arduino-cli upload -p /dev/cu.usbserial-XXXX smartfarm_firmware
#       arduino-cli board list              (หา port ตอนเสียบบอร์ด)
#
# ⚠️ PartitionScheme=huge_app จำเป็น ไม่ใช่ของเล่น:
#    firmware กินพื้นที่ 1388880 bytes = 105% ของ partition "default" (1310720) → build ไม่ผ่าน
#    huge_app ให้ 3145728 bytes → ใช้ไป 44% · ถ้าเจอ "Sketch too big" ให้เช็คบรรทัดนี้ก่อนโทษโค้ด
#    (ใน Arduino IDE ตั้งที่ Tools → Partition Scheme → "Huge APP (3MB No OTA/1MB SPIFFS)")
#
# หมายเหตุ: profile จะใช้ library ตามรายการนี้เท่านั้น ไม่ดึงจาก ~/Documents/Arduino/libraries
#           อยากเพิ่ม library ต้องมาเพิ่มที่นี่ด้วย ไม่งั้น build ไม่เห็น

profiles:
  esp32devkit:
    notes: ESP32 DevKit V1 — บอร์ดจริงที่ใช้หน้างาน (บริษัท ปุ๋ยไวกิ้ง)
    fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Firebase ESP32 Client (4.4.17)
      - OneWire (2.3.8)
      - DallasTemperature (4.0.6)
      - Adafruit SHT31 Library (2.2.2)
      - Adafruit BusIO (1.17.4)
      - LiquidCrystal I2C (1.1.2)

default_profile: esp32devkit
